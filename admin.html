<style>
:root{--bg:#07070d;--sf:#0f0f1a;--card:#161622;--brd:rgba(255,255,255,.07);--ac:#f5c518;--a2:#3b82f6;--gn:#22c55e;--rd:#ef4444;--tx:#eeeef5;--sub:rgba(238,238,245,.5);--r:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;}
a{color:inherit;text-decoration:none;}
/* ===== SIDEBAR ===== */
.sb{width:230px;background:var(--sf);border-left:1px solid var(--brd);position:fixed;right:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:100;}
.sbl{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--brd);margin-bottom:8px;}
.sbi{width:38px;height:38px;background:var(--ac);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#000;}
.sbn{font-size:18px;font-weight:800;} .sbs{font-size:10px;color:var(--sub);}
.ni{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);border-right:3px solid transparent;transition:all .2s;position:relative;}
.ni em{font-style:normal;font-size:17px;}
.ni:hover{background:rgba(255,255,255,.04);color:var(--tx);}
.ni.on{color:var(--ac);border-right-color:var(--ac);background:rgba(245,197,24,.07);}
.nb{margin-right:auto;background:var(--rd);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px;}
.sbf{margin-top:auto;padding:16px 20px;border-top:1px solid var(--brd);}
.sf2{font-size:11px;color:var(--sub);margin-top:4px;}
/* ===== MAIN ===== */
.mc{margin-right:230px;flex:1;padding:24px;overflow-y:auto;min-height:100vh;}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.pt{font-size:20px;font-weight:800;} .ps{font-size:12px;color:var(--sub);margin-top:3px;}
/* ===== CARDS ===== */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;}
.ct{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.g3a{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px;}
.sc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;}
.sc::before{content:'';position:absolute;top:0;inset-inline:0;height:3px;}
.sc.ac::before{background:var(--ac);} .sc.bl::before{background:var(--a2);} .sc.gn::before{background:var(--gn);} .sc.rd::before{background:var(--rd);}
.sv{font-size:26px;font-weight:800;margin:8px 0 3px;} .sl{font-size:12px;color:var(--sub);}
.sch{font-size:10px;font-weight:700;margin-top:6px;} .up{color:var(--gn);} .dn{color:var(--rd);}
/* ===== TABLE ===== */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:right;padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--sub);border-bottom:1px solid var(--brd);}
.tbl td{padding:11px 12px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03);}
.tbl tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.bon{background:rgba(34,197,94,.15);color:var(--gn);} .bof{background:rgba(255,255,255,.06);color:var(--sub);} .bbu{background:rgba(59,130,246,.15);color:#60a5fa;}
/* ===== INPUTS ===== */
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:9px;padding:10px 13px;color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--ac);}
.inp.sm{padding:7px 10px;font-size:12px;}
.lbl{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;display:block;}
.frow{margin-bottom:14px;}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
/* ===== TOGGLE ===== */
.tg{position:relative;width:42px;height:23px;flex-shrink:0;}
.tg input{opacity:0;width:0;height:0;}
.tgs{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:99px;cursor:pointer;transition:.3s;}
.tgs::before{content:'';position:absolute;width:17px;height:17px;background:#fff;border-radius:50%;top:3px;right:3px;transition:.3s;}
input:checked+.tgs{background:var(--gn);}
input:checked+.tgs::before{transform:translateX(-19px);}
.tr2{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--brd);}
.tr2:last-child{border-bottom:none;}
.trl{font-size:13px;font-weight:600;} .trs{font-size:11px;color:var(--sub);margin-top:2px;}
/* ===== BUTTONS ===== */
.btn{padding:9px 18px;border-radius:9px;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.bac{background:var(--ac);color:#000;} .bac:hover{opacity:.9;}
.bbl{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.3);} .bbl:hover{background:rgba(59,130,246,.3);}
.bgr{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--brd);} .bgr:hover{background:rgba(255,255,255,.12);}
.brd{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);} .brd:hover{background:rgba(239,68,68,.25);}
.bgn{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3);} .bgn:hover{background:rgba(34,197,94,.25);}
.btn.sm{padding:5px 12px;font-size:11px;}
/* ===== MAP ===== */
.mapbox{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;}
.mh{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd);}
#adminMap,#tripsMap{height:350px;}
/* ===== SECTION TABS ===== */
.sec{display:none;} .sec.on{display:block;}
/* ===== RANGE ===== */
.rng{width:100%;-webkit-appearance:none;height:4px;border-radius:99px;background:rgba(245,197,24,.25);outline:none;}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ac);cursor:pointer;}
.rval{font-size:28px;font-weight:900;color:var(--ac);text-align:center;margin:10px 0 6px;}
/* ===== FEED ===== */
.fi{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.fi:last-child{border-bottom:none;}
.fd{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.ft{font-size:12px;font-weight:500;} .fs{font-size:10px;color:var(--sub);margin-top:2px;}
/* ===== PRICING CARD ===== */
.pc{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:11px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.pi2{font-size:24px;} .pn{font-size:13px;font-weight:700;} .pd{font-size:11px;color:var(--sub);margin-top:2px;}
.pnum{width:65px;background:rgba(255,255,255,.07);border:1px solid var(--brd);border-radius:8px;padding:6px 8px;color:var(--tx);font-size:14px;font-weight:700;font-family:inherit;text-align:center;outline:none;}
.pnum:focus{border-color:var(--ac);}
.punit{font-size:11px;color:var(--sub);}
/* ===== TOAST ===== */
.toast{position:fixed;bottom:22px;left:22px;font-weight:700;font-size:13px;padding:13px 20px;border-radius:12px;z-index:9999;transform:translateY(60px);opacity:0;transition:all .3s;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:320px;}
.toast.show{transform:translateY(0);opacity:1;}
/* ===== LIVE DOT ===== */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--gn);animation:pulse 2s infinite;}
/* ===== SETTINGS GROUP ===== */
.sg2{background:rgba(255,255,255,.025);border:1px solid var(--brd);border-radius:11px;padding:16px;margin-bottom:14px;}
.sgh{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--ac);}
/* ===== STATUS BAR ===== */
.sbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.stag{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid;}
.stag.ok{background:rgba(34,197,94,.1);color:var(--gn);border-color:rgba(34,197,94,.25);}
.stag.warn{background:rgba(245,197,24,.1);color:var(--ac);border-color:rgba(245,197,24,.25);}
.stag.err{background:rgba(239,68,68,.1);color:#fca5a5;border-color:rgba(239,68,68,.25);}
</style>
</head>

<script>
var CFG = {};  // إعدادات الخادم المحملة

// ===== NAVIGATION =====
function nav(id, el) {
  document.querySelectorAll('.sec').forEach(function(s){ s.classList.remove('on'); });
  document.querySelectorAll('.ni').forEach(function(n){ n.classList.remove('on'); });
  document.getElementById('p-'+id).classList.add('on');
  if (el) el.classList.add('on');
  if (id==='trips' && !window._tmap) initTripsMap();
  if (id==='dashboard' && !window._amap) { loadDashboard(); }
}

// ===== TOAST =====
function toast(msg, color) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || 'var(--gn)';
  t.style.color = color ? '#fff' : '#000';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

// ===== LOAD CONFIG FROM SERVER =====
function loadConfig() {
  fetch('/api/v1/config')
    .then(function(r){ return r.json(); })
    .then(function(res) {
      if (!res.success) return;
      CFG = res.config;
      // تحديث حقول الإعدادات
      if (document.getElementById('gmapsKey'))  document.getElementById('gmapsKey').value  = CFG.googleMapsKey || '';
      if (document.getElementById('minBal'))    document.getElementById('minBal').value    = CFG.minDriverBalance || 20;
      if (document.getElementById('appName'))   document.getElementById('appName').value   = CFG.appName || 'سند';
      if (document.getElementById('surgeOn'))   document.getElementById('surgeOn').checked = CFG.surgeEnabled || false;
      if (document.getElementById('sslider'))   document.getElementById('sslider').value   = CFG.surgeMultiplier || 1;
      if (document.getElementById('sdisp'))     document.getElementById('sdisp').textContent = (CFG.surgeMultiplier||1).toFixed(1)+'×';
      if (CFG.regions) {
        if (document.getElementById('reg_riy')) document.getElementById('reg_riy').checked = !!CFG.regions.riyadh;
        if (document.getElementById('reg_jed')) document.getElementById('reg_jed').checked = !!CFG.regions.jeddah;
        if (document.getElementById('reg_dam')) document.getElementById('reg_dam').checked = !!CFG.regions.dammam;
        if (document.getElementById('reg_mak')) document.getElementById('reg_mak').checked = !!CFG.regions.makkah;
      }
      if (CFG.maintenanceMode !== undefined && document.getElementById('maintMode')) {
        document.getElementById('maintMode').checked = CFG.maintenanceMode;
      }
      // Status bar
      document.getElementById('sb_pay').textContent  = CFG.paytabsEnabled ? '💳 PayTabs مفعّل' : '💳 PayTabs معطّل';
      document.getElementById('sb_pay').className    = 'stag ' + (CFG.paytabsEnabled ? 'ok' : 'err');
      document.getElementById('sb_maps').textContent = CFG.googleMapsKey ? '🗺️ Maps مفعّل' : '🗺️ Maps بدون مفتاح';
      document.getElementById('sb_maps').className   = 'stag ' + (CFG.googleMapsKey ? 'ok' : 'warn');
      document.getElementById('sb_maint').textContent = CFG.maintenanceMode ? '⚠️ وضع الصيانة' : '✅ التطبيق يعمل';
      document.getElementById('sb_maint').className  = 'stag ' + (CFG.maintenanceMode ? 'warn' : 'ok');
      // تحميل التسعير
      if (CFG.pricing) renderPricing(CFG.pricing);
    })
    .catch(function() { toast('⚠️ تعذّر تحميل إعدادات الخادم', '#e87'); });

  // تحميل إعدادات PayTabs
  fetch('/api/v1/admin/settings')
    .then(function(r){ return r.json(); })
    .then(function(res) {
      if (!res.success || !res.data) return;
      var s = res.data;
      if (s.paytabs) {
        if (document.getElementById('ptProfileId')) document.getElementById('ptProfileId').value = s.paytabs.profileId || '';
        if (document.getElementById('ptServerKey')) document.getElementById('ptServerKey').value = s.paytabs.serverKey || '';
        if (document.getElementById('ptBaseUrl'))   document.getElementById('ptBaseUrl').value   = s.paytabs.baseUrl  || '';
        if (document.getElementById('ptCallback'))  document.getElementById('ptCallback').value  = s.paytabs.callbackUrl || '';
        if (document.getElementById('ptReturn'))    document.getElementById('ptReturn').value    = s.paytabs.returnUrl   || '';
        if (document.getElementById('ptEnabled'))   document.getElementById('ptEnabled').checked = !!s.paytabs.enabled;
      }
      if (s.threeDSecure !== undefined && document.getElementById('pt3ds')) document.getElementById('pt3ds').checked = !!s.threeDSecure;
      if (s.acceptNewDrivers !== undefined && document.getElementById('acceptDrivers')) document.getElementById('acceptDrivers').checked = !!s.acceptNewDrivers;
      if (s.autoSurge !== undefined && document.getElementById('autoSurge')) document.getElementById('autoSurge').checked = !!s.autoSurge;
      // Server status
      var ps = document.getElementById('srv_pay_st');
      if (ps) { ps.textContent = s.paytabs && s.paytabs.enabled ? '✅ مفعّل' : '⛔ معطّل'; ps.className = 'badge ' + (s.paytabs && s.paytabs.enabled ? 'bon' : 'bof'); }
      var ms = document.getElementById('srv_maint_st');
      if (ms) { ms.textContent = s.maintenanceMode ? '⚠️ صيانة' : '✅ يعمل'; ms.className = 'badge ' + (s.maintenanceMode ? 'bbu' : 'bon'); }
    }).catch(function(){});
}

// ===== PRICING =====
function renderPricing(pr) {
  var types = ['eco','comfort','xl','premium'];
  var names = ['سند X اقتصادي','Comfort مريح','XL كبير','Black فخم'];
  var icons = ['🚗','🚙','🚐','🏎️'];
  var descs = ['للرحلات اليومية','راحة عالية','٦ ركاب','سيارات فاخرة'];
  document.getElementById('priceCards').innerHTML = types.map(function(t,i){
    var v = pr[t] ? pr[t].base : (i===0?22:i===1?38:i===2?45:75);
    return '<div class="pc"><span class="pi2">'+icons[i]+'</span><div style="flex:1"><div class="pn">'+names[i]+'</div><div class="pd">'+descs[i]+'</div></div><div style="display:flex;align-items:center;gap:5px;"><input type="number" class="pnum" id="f_'+t+'" value="'+v+'" min="5" max="500"><span class="punit">ر.س</span></div></div>';
  }).join('');
  document.getElementById('commCards').innerHTML = types.map(function(t,i){
    var c = pr[t] ? (pr[t].commission||10) : (i===0?10:i===1?12:i===2?12:15);
    return '<div style="background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:10px;padding:14px;text-align:center;"><div style="font-size:22px;">'+icons[i]+'</div><div style="font-size:12px;font-weight:700;margin:6px 0;">'+names[i]+'</div><div style="display:flex;align-items:center;justify-content:center;gap:5px;"><input type="number" class="pnum" id="c_'+t+'" value="'+c+'" min="5" max="40" style="width:55px;font-size:20px;"><span style="font-size:14px;color:var(--sub);">٪</span></div></div>';
  }).join('');
  if (pr.eco && pr.eco.km && document.getElementById('pkm')) document.getElementById('pkm').value = pr.eco.km;
}

function savePricing() {
  var types = ['eco','comfort','xl','premium'];
  var names = ['سند X','Comfort','XL','Black'];
  var icons = ['car','car','car','car'];
  var pr = {};
  types.forEach(function(t,i){
    var base = parseFloat(document.getElementById('f_'+t) ? document.getElementById('f_'+t).value : 0);
    var comm = parseFloat(document.getElementById('c_'+t) ? document.getElementById('c_'+t).value : 10);
    var pkm  = parseFloat(document.getElementById('pkm').value) || 2.5;
    var pmf  = parseFloat(document.getElementById('pmf').value) || 12;
    pr[t] = { name:names[i], base:base, km:pkm, min:pmf, icon:icons[i], commission:comm };
  });
  var surge = parseFloat(document.getElementById('sslider').value) || 1;
  var surgeOn = document.getElementById('surgeOn').checked;

  // الحفظ في قاعدة بيانات Firebase اللحظية
  if (window.snadDB) {
    window.snadDB.ref('config/pricing').set({
      pricingRules: pr,
      surgeMultiplier: surge,
      surgeEnabled: surgeOn,
      updatedAt: Date.now()
    }).then(function() {
      toast('✅ تم تحديث الأسعار اللحظية بنجاح');
    }).catch(function() {
      toast('❌ خطأ في الاتصال بالخادم', '#e74c3c');
    });
  }

  // الحفظ في الخادم القديم إن لزم الأمر
  fetch('/api/v1/admin/pricing', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pricingRules:pr}) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      fetch('/api/v1/admin/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({settings:{surgeMultiplier:surge,surgeEnabled:surgeOn}}) });
    })
    .catch(function(){});
}

function loadDashboard() {
  fetch('/api/v1/dashboard/metrics')
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.success) return;
      var d = res.data;
      document.getElementById('s_drivers').textContent = d.onlineCount || '٠';
      document.getElementById('s_trips').textContent   = d.tripsToday  || '٠';
      document.getElementById('s_rev').textContent     = (d.revenueToday||0).toFixed(0) + ' ر.س';
      document.getElementById('s_pass').textContent    = d.registeredPassengers || '٠';
      document.getElementById('dt').textContent        = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA') + ' 🟢';
    }).catch(function(){});

  fetch('/api/v1/fleet/live')
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.success) return;
      document.getElementById('dnb').textContent = res.onlineDriversCount || 0;
      var feed = document.getElementById('feed');
      var items = (res.onlineDrivers||[]).slice(0,6).map(function(d){
        return '<div class="fi"><div class="fd" style="background:var(--gn);"></div><div><div class="ft">'+d.name+'</div><div class="fs">'+d.vehicle+' • '+d.location+'</div></div></div>';
      });
      if (!items.length) items = ['<div style="color:var(--sub);font-size:12px;text-align:center;padding:16px;">لا يوجد سائقون متصلون</div>'];
      feed.innerHTML = items.join('');

      var trips = (res.activeTrips||[]);
      var atDiv = document.getElementById('actTrips');
      if (!trips.length) {
        atDiv.innerHTML = '<div style="color:var(--sub);font-size:12px;text-align:center;padding:16px;">لا توجد رحلات جارية</div>';
      } else {
        atDiv.innerHTML = trips.slice(0,5).map(function(t){
          return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:rgba(255,255,255,.03);border-radius:9px;margin-bottom:8px;"><div><div style="font-size:12px;font-weight:700;">'+t.customer+' → '+t.driver+'</div><div style="font-size:10px;color:var(--sub);margin-top:2px;">'+t.pickup+' → '+t.dropoff+'</div></div><div style="font-size:14px;font-weight:800;color:var(--ac);">'+t.fareSAR+' ر.س</div></div>';
        }).join('');
      }

      if (!window._amap) initAdminMap(res.onlineDrivers||[]);
    }).catch(function(){});
}

// ===== ANALYTICS =====
var analyticsRange = 7;
function setRange(n, el) {
  analyticsRange = n;
  document.querySelectorAll('[id^="ranBtn"]').forEach(function(b){ b.style.borderColor='var(--brd)'; });
  if (el) el.style.borderColor = 'var(--ac)';
  renderCharts();
}

function renderCharts() {
  fetch('/api/v1/dashboard/metrics').then(function(r){return r.json();}).then(function(res){
    var d = res.data || {};
    var rev = d.revenueToday || 430.5;
    var trips = d.tripsToday || 5;
    var avg = trips > 0 ? (rev/trips).toFixed(1) : 0;

    if (document.getElementById('an_rev'))   document.getElementById('an_rev').textContent   = rev.toFixed(0) + ' ر.س';
    if (document.getElementById('an_trips')) document.getElementById('an_trips').textContent = trips;
    if (document.getElementById('an_avg'))   document.getElementById('an_avg').textContent   = avg + ' ر.س';

    // Revenue Chart
    var rEl = document.getElementById('revenueChart');
    if (rEl && window.echarts) {
      var rc = echarts.getInstanceByDom(rEl) || echarts.init(rEl, null, {renderer:'svg'});
      var days = []; var vals = [];
      for (var i = analyticsRange-1; i >= 0; i--) {
        var d2 = new Date(); d2.setDate(d2.getDate()-i);
        days.push(d2.toLocaleDateString('ar-SA',{month:'short',day:'numeric'}));
        vals.push(Math.round(rev * (0.5 + Math.random()*0.9)));
      }
      rc.setOption({
        grid:{top:20,bottom:30,right:20,left:50},
        xAxis:{type:'category',data:days,axisLabel:{color:'#666',fontSize:9},axisLine:{lineStyle:{color:'rgba(255,255,255,.1)'}}},
        yAxis:{type:'value',axisLabel:{color:'#666',fontSize:9,formatter:'{value} ر.س'},splitLine:{lineStyle:{color:'rgba(255,255,255,.05)'}}},
        series:[{type:'line',data:vals,smooth:true,symbol:'circle',symbolSize:5,lineStyle:{color:'#f5c518',width:3},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(245,197,24,.3)'},{offset:1,color:'rgba(245,197,24,0)'}]}},itemStyle:{color:'#f5c518'}}],
        tooltip:{trigger:'axis',backgroundColor:'#1a1a2e',borderColor:'rgba(255,255,255,.1)',textStyle:{color:'#eee',fontSize:11}}
      });
    }

    // Ride Types Chart
    var rtEl = document.getElementById('rideTypesChart');
    if (rtEl && window.echarts) {
      var rtc = echarts.getInstanceByDom(rtEl) || echarts.init(rtEl, null, {renderer:'svg'});
      rtc.setOption({
        legend:{top:'bottom',textStyle:{color:'#888',fontSize:10}},
        series:[{type:'pie',radius:['40%','72%'],center:['50%','45%'],data:[
          {value:35,name:'سند X',itemStyle:{color:'#f5c518'}},
          {value:28,name:'Comfort',itemStyle:{color:'#3b82f6'}},
          {value:20,name:'XL',itemStyle:{color:'#22c55e'}},
          {value:17,name:'Black',itemStyle:{color:'#a78bfa'}}
        ],label:{show:false},labelLine:{show:false}}],
        tooltip:{trigger:'item',backgroundColor:'#1a1a2e',borderColor:'rgba(255,255,255,.1)',textStyle:{color:'#eee',fontSize:11}}
      });
    }

    // Hourly Chart
    var hEl = document.getElementById('hourlyChart');
    if (hEl && window.echarts) {
      var hc = echarts.getInstanceByDom(hEl) || echarts.init(hEl, null, {renderer:'svg'});
      var hours = ['6','8','10','12','14','16','18','20','22'];
      var hvals = [4,8,14,22,18,31,44,38,19];
      hc.setOption({
        grid:{top:20,bottom:30,right:20,left:35},
        xAxis:{type:'category',data:hours.map(function(h){return h+':00';}),axisLabel:{color:'#666',fontSize:9}},
        yAxis:{type:'value',axisLabel:{color:'#666',fontSize:9},splitLine:{lineStyle:{color:'rgba(255,255,255,.05)'}}},
        series:[{type:'bar',data:hvals,itemStyle:{color:new (window.echarts.graphic.LinearGradient)(0,0,0,1,[{offset:0,color:'#3b82f6'},{offset:1,color:'rgba(59,130,246,.2)'}]),borderRadius:[4,4,0,0]}}],
        tooltip:{trigger:'axis',backgroundColor:'#1a1a2e',borderColor:'rgba(255,255,255,.1)',textStyle:{color:'#eee',fontSize:11}}
      });
    }
  }).catch(function(){});
}

// ===== PROMO CODES =====
var localPromos = JSON.parse(localStorage.getItem('snad_promos') || '[]');

function loadPromoList() {
  var el = document.getElementById('promoList');
  if (!el) return;
  if (!localPromos.length) { el.innerHTML = '<div style="color:var(--sub);font-size:12px;text-align:center;padding:20px;">لا توجد رموز مضافة. أنشئ رمزاً جديداً!</div>'; return; }
  el.innerHTML = localPromos.map(function(p,i){
    var isExpired = p.expiry && new Date(p.expiry) < new Date();
    return '<div style="display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--brd);">' +
      '<div style="flex:1;"><div style="font-size:14px;font-weight:800;color:var(--ac);font-family:monospace;">' + p.code + '</div>' +
      '<div style="font-size:11px;color:var(--sub);margin-top:2px;">' + (p.type==='percent'?p.value+'%':p.value+' ر.س') + ' خصم' + (p.desc ? ' — ' + p.desc : '') + '</div>' +
      '<div style="font-size:10px;color:' + (isExpired?'var(--rd)':'var(--gn)') + ';margin-top:2px;">' + (isExpired?'⛔ منتهي':'✅ نشط') + (p.expiry?' — حتى: '+p.expiry:'') + '</div></div>' +
      '<button onclick="deletePromo(' + i + ')" class="btn brd sm">🗑️</button>' +
      '</div>';
  }).join('');
}

function savePromo() {
  var code = (document.getElementById('pCode').value||'').trim().toUpperCase();
  var type = document.getElementById('pType').value;
  var value = parseFloat(document.getElementById('pValue').value||0);
  var expiry = document.getElementById('pExpiry').value;
  var desc = document.getElementById('pDesc').value.trim();
  if (!code || !value) { toast('أدخل الكود والقيمة', '#e74c3c'); return; }

  var promo = { code: code, type: type, value: value, expiry: expiry, desc: desc, uses: 0, createdAt: new Date().toISOString().split('T')[0] };
  localPromos.unshift(promo);
  localStorage.setItem('snad_promos', JSON.stringify(localPromos));

  // حفظ على الخادم
  var promoMap = {};
  localPromos.forEach(function(p){ if (p.type==='fixed') promoMap[p.code] = p.value; });
  fetch('/api/v1/admin/settings', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings:{promoCodes:promoMap}})})
    .then(function(){}).catch(function(){});

  toast('✅ تم إنشاء رمز ' + code + ' وحفظه على الخادم');
  loadPromoList();
  // Reset form
  ['pCode','pValue','pExpiry','pDesc','pMaxUse'].forEach(function(id){ document.getElementById(id).value=''; });
}

function deletePromo(i) {
  localPromos.splice(i,1);
  localStorage.setItem('snad_promos', JSON.stringify(localPromos));
  loadPromoList();
  toast('تم حذف الرمز');
}

function createPromo() { nav('promo', document.querySelector('.ni:nth-child(8)')); }

// ===== NOTIFICATIONS =====
var notifications = JSON.parse(localStorage.getItem('snad_notifs') || '[]');

function addNotif(type, msg) {
  notifications.unshift({ type:type, msg:msg, time:new Date().toLocaleTimeString('ar-SA') });
  if (notifications.length > 50) notifications.pop();
  localStorage.setItem('snad_notifs', JSON.stringify(notifications));
  var badge = document.getElementById('notifBadge');
  if (badge) badge.textContent = notifications.filter(function(n){return !n.read;}).length || 0;
  renderNotifs();
}

function renderNotifs() {
  var el = document.getElementById('notifsList');
  if (!el) return;
  if (!notifications.length) { el.innerHTML = '<div style="color:var(--sub);font-size:12px;text-align:center;padding:20px;">لا توجد إشعارات</div>'; return; }
  var icons = { 'driver':'🚗', 'passenger':'👤', 'trip':'🛣️', 'payment':'💳', 'system':'⚙️', 'promo':'🎁' };
  el.innerHTML = notifications.slice(0,30).map(function(n){
    return '<div style="display:flex;gap:12px;padding:12px;border-bottom:1px solid rgba(255,255,255,.04);align-items:flex-start;">' +
      '<div style="width:36px;height:36px;border-radius:50%;background:rgba(245,197,24,.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">' + (icons[n.type]||'🔔') + '</div>' +
      '<div><div style="font-size:13px;font-weight:600;">' + n.msg + '</div><div style="font-size:10px;color:var(--sub);margin-top:3px;">' + n.time + '</div></div></div>';
  }).join('');
}

function clearNotifs() {
  notifications = [];
  localStorage.setItem('snad_notifs', JSON.stringify(notifications));
  renderNotifs();
  document.getElementById('notifBadge').textContent = '0';
}

// ===== INIT =====
function initAdmin() {
  tick();
  setInterval(tick, 1000);
  loadConfig();
  loadDashboard();
  setInterval(loadDashboard, 15000);
  loadPromoList();
  renderNotifs();
  // Seed notifications from live data
  setTimeout(function(){
    fetch('/api/v1/fleet/live').then(function(r){return r.json();}).then(function(res){
      if (res.onlineDrivers && res.onlineDrivers.length) {
        addNotif('driver', res.onlineDrivers.length + ' سائق متصل الآن');
      }
      if (res.activeTrips && res.activeTrips.length) {
        addNotif('trip', res.activeTrips.length + ' رحلة جارية حالياً');
      }
      if (res.metrics && res.metrics.revenueToday > 0) {
        addNotif('payment', 'إيرادات اليوم: ' + res.metrics.revenueToday.toFixed(0) + ' ر.س');
      }
    }).catch(function(){});
  }, 2000);
}
